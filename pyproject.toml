[project]
name = "bakery-os"
version = "0.1.0"
description = "Agentic operating system for a small bakery."
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2024.10.7"
]

[project.scripts]
bakery = "bakery.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bakery*"]
